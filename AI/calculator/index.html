<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>계산기</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{display:flex;justify-content:center;align-items:center;min-height:100vh;padding:16px;background:#f4f5f7;font-family:-apple-system,'Pretendard','Malgun Gothic',sans-serif}
.blind{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.calc{width:100%;max-width:320px;padding:20px;background:#1f2126;border-radius:20px;box-shadow:0 12px 30px rgba(0,0,0,.18)}
.calc_screen{margin-bottom:16px;padding:16px 8px 8px;text-align:right;color:#fff}
.calc_expr{min-height:20px;color:#8a8f98;font-size:14px}
.calc_value{font-size:40px;font-weight:300;word-break:break-all}
.calc_keys{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.calc_keys button{height:60px;border:0;border-radius:14px;background:#33363d;color:#fff;font-size:20px;cursor:pointer}
.calc_keys button:active{filter:brightness(1.3)}
.calc_keys .fn{background:#5a5e67}
.calc_keys .op{background:#4f6bed}
.calc_keys .op.on{background:#fff;color:#4f6bed}
.calc_keys .zero{grid-column:span 2}
</style>
</head>
<body>

<div class="calc">
  <h1 class="blind">계산기</h1>
  <div class="calc_screen" aria-live="polite">
    <p class="calc_expr"></p>
    <p class="calc_value">0</p>
  </div>

  <div class="calc_keys">
    <button type="button" class="fn" data-action="clear">AC</button>
    <button type="button" class="fn" data-action="sign">±</button>
    <button type="button" class="fn" data-action="percent">%</button>
    <button type="button" class="op" data-op="/">÷</button>

    <button type="button" data-num="7">7</button>
    <button type="button" data-num="8">8</button>
    <button type="button" data-num="9">9</button>
    <button type="button" class="op" data-op="*">×</button>

    <button type="button" data-num="4">4</button>
    <button type="button" data-num="5">5</button>
    <button type="button" data-num="6">6</button>
    <button type="button" class="op" data-op="-">−</button>

    <button type="button" data-num="1">1</button>
    <button type="button" data-num="2">2</button>
    <button type="button" data-num="3">3</button>
    <button type="button" class="op" data-op="+">+</button>

    <button type="button" class="zero" data-num="0">0</button>
    <button type="button" data-action="dot">.</button>
    <button type="button" class="op" data-action="equal">=</button>
  </div>
</div>

<script>
var exprEl = document.querySelector('.calc_expr');
var valueEl = document.querySelector('.calc_value');
var keys = document.querySelector('.calc_keys');
var OP_TEXT = { '+': '+', '-': '−', '*': '×', '/': '÷' };

// 계산기 상태: 화면 문자열이 아니라 이 세 값으로 계산한다
var current = '0';   // 지금 입력 중인 숫자(문자열)
var prev = null;     // 연산자 앞에 입력해 둔 숫자
var op = null;       // 선택된 연산자
var resetNext = false; // 다음 숫자 입력 시 current를 새로 시작할지

// 두 수와 연산자를 받아 결과(숫자)를 돌려준다
function calculate(a, operator, b){
  // TODO(human)
}

function render(){
  valueEl.textContent = current;
  exprEl.textContent = prev !== null && op ? prev + ' ' + OP_TEXT[op] : '';
  keys.querySelectorAll('[data-op]').forEach(function(btn){
    btn.classList.toggle('on', btn.dataset.op === op && resetNext);
  });
}

function inputNum(n){
  if (resetNext || current === '0') { current = n; resetNext = false; }
  else if (current.length < 12) current += n;
}

function inputDot(){
  if (resetNext) { current = '0.'; resetNext = false; return; }
  if (current.indexOf('.') === -1) current += '.';
}

function inputOp(nextOp){
  // 연산자를 연달아 누르면 앞 계산을 먼저 끝낸다 (3 + 4 × → 7 ×)
  if (op && !resetNext) current = String(calculate(Number(prev), op, Number(current)));
  prev = current;
  op = nextOp;
  resetNext = true;
}

function equal(){
  if (!op) return;
  exprEl.textContent = '';
  current = String(calculate(Number(prev), op, Number(current)));
  prev = null;
  op = null;
  resetNext = true;
}

function clearAll(){
  current = '0'; prev = null; op = null; resetNext = false;
}

// 버튼마다 이벤트를 달지 않고 .calc_keys 하나에서 위임 처리
keys.addEventListener('click', function(e){
  var btn = e.target.closest('button');
  if (!btn) return;

  if (btn.dataset.num) inputNum(btn.dataset.num);
  else if (btn.dataset.op) inputOp(btn.dataset.op);
  else if (btn.dataset.action === 'dot') inputDot();
  else if (btn.dataset.action === 'equal') equal();
  else if (btn.dataset.action === 'clear') clearAll();
  else if (btn.dataset.action === 'sign') current = String(-Number(current));
  else if (btn.dataset.action === 'percent') current = String(Number(current) / 100);

  render();
});

// 키보드 입력도 같은 함수로 연결
document.addEventListener('keydown', function(e){
  if (/^[0-9]$/.test(e.key)) inputNum(e.key);
  else if (OP_TEXT[e.key]) inputOp(e.key);
  else if (e.key === '.') inputDot();
  else if (e.key === 'Enter' || e.key === '=') { e.preventDefault(); equal(); }
  else if (e.key === 'Escape') clearAll();
  else if (e.key === 'Backspace') current = current.length > 1 ? current.slice(0, -1) : '0';
  else return;
  render();
});
</script>
</body>
</html>
