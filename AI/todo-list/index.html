<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>투두 리스트</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;padding:60px 16px;background:#f4f5f7;font-family:-apple-system,'Pretendard','Malgun Gothic',sans-serif;color:#222}
.blind{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.todo{max-width:480px;margin:0 auto;padding:28px 24px;background:#fff;border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.06)}
.todo h1{margin-bottom:20px;font-size:24px}
.todo_form{display:flex;gap:8px;margin-bottom:16px}
.todo_form input{flex:1;padding:12px 14px;border:1px solid #ddd;border-radius:10px;font-size:15px}
.todo_form input:focus{outline:none;border-color:#4f6bed}
.todo_form button{padding:0 18px;border:0;border-radius:10px;background:#4f6bed;color:#fff;font-size:15px;cursor:pointer}
.todo_filter{display:flex;gap:6px;margin-bottom:12px}
.todo_filter button{padding:6px 12px;border:1px solid #ddd;border-radius:20px;background:#fff;font-size:13px;cursor:pointer}
.todo_filter button.on{border-color:#4f6bed;background:#4f6bed;color:#fff}
.todo_list{list-style:none}
.todo_list li{display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid #eee}
.todo_list li label{flex:1;display:flex;align-items:center;gap:10px;cursor:pointer;word-break:break-all}
.todo_list li input{width:18px;height:18px;accent-color:#4f6bed}
.todo_list li.done span{color:#aaa;text-decoration:line-through}
.todo_list .btn_del{border:0;background:none;color:#bbb;font-size:18px;cursor:pointer}
.todo_list .btn_del:hover{color:#e5484d}
.todo_empty{padding:30px 0;color:#aaa;text-align:center;font-size:14px}
.todo_foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;color:#888;font-size:13px}
.todo_foot button{border:0;background:none;color:#888;font-size:13px;cursor:pointer;text-decoration:underline}
</style>
</head>
<body>

<div class="todo">
  <h1>오늘 할 일</h1>

  <form class="todo_form">
    <label for="todoInput" class="blind">할 일 입력</label>
    <input type="text" id="todoInput" placeholder="할 일을 입력하세요" autocomplete="off">
    <button type="submit">추가</button>
  </form>

  <div class="todo_filter">
    <button type="button" class="on" data-filter="all">전체</button>
    <button type="button" data-filter="active">진행중</button>
    <button type="button" data-filter="done">완료</button>
  </div>

  <ul class="todo_list"></ul>
  <p class="todo_empty">할 일이 없습니다.</p>

  <div class="todo_foot">
    <span class="todo_count">0개 남음</span>
    <button type="button" class="btn_clear">완료 항목 삭제</button>
  </div>
</div>

<script>
var STORAGE_KEY = 'study-todo-list';
var form = document.querySelector('.todo_form');
var input = document.querySelector('#todoInput');
var list = document.querySelector('.todo_list');
var empty = document.querySelector('.todo_empty');
var count = document.querySelector('.todo_count');
var filterBtns = document.querySelectorAll('.todo_filter button');

var todos = load();
var filter = 'all';

// localStorage 읽기/쓰기 (사생활 보호 모드 등에서 실패해도 동작하도록 try/catch)
function load(){
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
  catch(e){ return []; }
}
function save(){
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(todos)); } catch(e){}
}

// 데이터 배열 → 화면 다시 그리기
function render(){
  var shown = todos.filter(function(todo){
    if (filter === 'active') return !todo.done;
    if (filter === 'done') return todo.done;
    return true;
  });

  list.innerHTML = '';
  shown.forEach(function(todo){
    var li = document.createElement('li');
    li.dataset.id = todo.id;
    if (todo.done) li.classList.add('done');

    var label = document.createElement('label');
    var check = document.createElement('input');
    check.type = 'checkbox';
    check.checked = todo.done;
    var text = document.createElement('span');
    text.textContent = todo.text; // innerHTML 대신 textContent로 넣어 태그 입력을 그대로 글자로 표시

    var del = document.createElement('button');
    del.type = 'button';
    del.className = 'btn_del';
    del.innerHTML = '&times;<span class="blind">삭제</span>';

    label.append(check, text);
    li.append(label, del);
    list.appendChild(li);
  });

  empty.style.display = shown.length ? 'none' : 'block';
  count.textContent = todos.filter(function(todo){ return !todo.done; }).length + '개 남음';
}

// 추가
form.addEventListener('submit', function(e){
  e.preventDefault();
  var text = input.value.trim();
  if (!text) return;
  todos.push({ id: Date.now(), text: text, done: false });
  input.value = '';
  save();
  render();
});

// 체크/삭제 - li마다 이벤트를 달지 않고 ul 하나에서 이벤트 위임으로 처리
list.addEventListener('change', function(e){
  var id = Number(e.target.closest('li').dataset.id);
  todos.forEach(function(todo){ if (todo.id === id) todo.done = e.target.checked; });
  save();
  render();
});
list.addEventListener('click', function(e){
  var btn = e.target.closest('.btn_del');
  if (!btn) return;
  var id = Number(btn.closest('li').dataset.id);
  todos = todos.filter(function(todo){ return todo.id !== id; });
  save();
  render();
});

// 필터
filterBtns.forEach(function(btn){
  btn.addEventListener('click', function(){
    filterBtns.forEach(function(b){ b.classList.remove('on'); });
    btn.classList.add('on');
    filter = btn.dataset.filter;
    render();
  });
});

// 완료 항목 일괄 삭제
document.querySelector('.btn_clear').addEventListener('click', function(){
  todos = todos.filter(function(todo){ return !todo.done; });
  save();
  render();
});

render();
</script>
</body>
</html>
