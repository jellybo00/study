<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>카운터 앱</title>
  <!-- Tailwind CSS를 CDN으로 불러온다 (설치 없이 클래스 이름만으로 스타일링 가능) -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex items-center justify-center bg-slate-100">

  <!-- 카드: 카운터 전체를 감싸는 흰색 상자 -->
  <main class="w-full max-w-sm mx-4 p-8 bg-white rounded-2xl shadow-lg text-center">
    <h1 class="text-xl font-bold text-slate-700">카운터</h1>

    <!-- 현재 카운트 숫자 표시 영역 -->
    <!-- aria-live="polite": 숫자가 바뀌면 스크린리더가 읽어준다 -->
    <p id="count" class="my-8 text-7xl font-bold text-blue-600 tabular-nums" aria-live="polite">0</p>

    <!-- 버튼 3개: 감소 / 리셋 / 증가 -->
    <div class="flex gap-3">
      <button id="btnDecrease" type="button"
        class="flex-1 py-3 rounded-xl bg-blue-100 text-blue-700 text-lg font-semibold hover:bg-blue-200 active:scale-95 transition">
        -1
      </button>
      <button id="btnReset" type="button"
        class="flex-1 py-3 rounded-xl border-2 border-blue-300 text-blue-600 text-lg font-semibold hover:bg-blue-50 active:scale-95 transition">
        리셋
      </button>
      <button id="btnIncrease" type="button"
        class="flex-1 py-3 rounded-xl bg-blue-600 text-white text-lg font-semibold hover:bg-blue-700 active:scale-95 transition">
        +1
      </button>
    </div>
  </main>

  <script>
    // 1. 현재 숫자를 기억하는 변수 (처음 값은 0)
    let count = 0;

    // 2. 화면에서 조작할 요소들을 미리 찾아둔다
    const countEl = document.getElementById('count');
    const btnIncrease = document.getElementById('btnIncrease');
    const btnDecrease = document.getElementById('btnDecrease');
    const btnReset = document.getElementById('btnReset');

    // 3. 변수 count 값을 화면에 그려주는 함수
    function render() {
      countEl.textContent = count;
    }

    // 4. 버튼마다 "클릭되면 할 일"을 등록한다
    btnIncrease.addEventListener('click', function () {
      count = count + 1; // 1 더하기
      render();
    });

    btnDecrease.addEventListener('click', function () {
      count = count - 1; // 1 빼기
      render();
    });

    btnReset.addEventListener('click', function () {
      count = 0; // 처음 값으로 되돌리기
      render();
    });
  </script>
</body>
</html>
